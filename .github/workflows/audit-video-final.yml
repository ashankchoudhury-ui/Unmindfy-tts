name: UNMINDY Final Video Render And Audit

on:
  push:
    paths:
      - '.github/workflows/audit-video-final.yml'
  workflow_dispatch:

jobs:
  render_and_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install render dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-urw-base35 python3 python3-venv curl
          python3 -m venv /tmp/whisperx
          /tmp/whisperx/bin/python -m pip install --upgrade pip
          /tmp/whisperx/bin/python -m pip install whisperx
          command -v ffmpeg
          command -v ffprobe
          /tmp/whisperx/bin/python -c "import whisperx; print('WhisperX ready')"
          fc-match Courier
      - name: Prepare renderer for source-native final render
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/render-reel.mjs')
          s = p.read_text()
          old_pages = """function captionPages(words) {
  const MAX_LINES = 3, TARGET = 11, MIN = 9, MAX = 12, pages = [];
  let page = [], i = 0;
  while (i < words.length) {
    const candidate = [...page, words[i]], overflow = layoutWords(candidate).length > MAX_LINES;
    if (page.length && (page.length >= MAX || (page.length >= MIN && (page.length >= TARGET || overflow)))) { pages.push(page); page = []; continue; }
    page = candidate; i++;
  }
  if (page.length) pages.push(page);
  if (pages.length > 1 && pages.at(-1).length < MIN) {
    const tail = pages.pop(), prev = pages.pop() || [];
    while (tail.length && prev.length < MAX) prev.push(tail.shift());
    if (prev.length) pages.push(prev);
    if (tail.length) pages.push(tail);
  }
  return pages;
}"""
          new_pages = """function captionPages(words) {
  const MAX_LINES = 3, TARGET = 11, MIN = 9, MAX = 12, pages = [];
  let page = [], i = 0;
  while (i < words.length) {
    const candidate = [...page, words[i]], overflow = layoutWords(candidate).length > MAX_LINES;
    if (page.length && overflow) { pages.push(page); page = []; continue; }
    if (page.length && page.length >= MAX) { pages.push(page); page = []; continue; }
    page = candidate; i++;
  }
  if (page.length) pages.push(page);
  if (pages.length > 1 && pages.at(-1).length < MIN) {
    const tail = pages.pop(), prev = pages.pop() || [];
    while (tail.length && prev.length < MAX && layoutWords([...prev, tail[0]]).length <= MAX_LINES) prev.push(tail.shift());
    if (prev.length) pages.push(prev);
    if (tail.length) pages.push(tail);
  }
  return pages;
}"""
          replacements = [
            ("const OUTPUT_WIDTH = 1920;", "const OUTPUT_WIDTH = 1280;"),
            ("const OUTPUT_HEIGHT = 1080;", "const OUTPUT_HEIGHT = 720;"),
            ("const MAX = 22, lines = [];", "const MAX = 13, lines = [];"),
            ("const FONT = 56, BOX_W = 780, SAFE_X = (OUTPUT_WIDTH - BOX_W) / 2, CAPTION_Y = 96;", "const FONT = 56, BOX_W = 600, SAFE_X = (OUTPUT_WIDTH - BOX_W) / 2, CAPTION_Y = 145;"),
            (old_pages, new_pages),
            ("    if (!music) throw new Error('No music file found in UNMINDY/Music');", "    if (!music) console.log('No music found; using generated ambient bed as fallback.');"),
            ("    console.log(`Music: ${music.name}`);", "    console.log(`Music: ${music?.name || 'generated ambient bed'}`);"),
            ("    const musicPath = path.join(WORK, `music${path.extname(music.name) || '.mp3'}`);", "    const musicPath = path.join(WORK, `music${path.extname(music?.name || 'ambient.m4a') || '.m4a'}`);"),
            ("    await downloadDriveFile(token, music, musicPath);", "    if (music) await downloadDriveFile(token, music, musicPath);"),
            ("    await buildAmbient(total, ambientPath);\n    await buildAudio(voicePath, musicPath, total, audioPath);", "    await buildAmbient(total, ambientPath);\n    await buildAudio(voicePath, music ? musicPath : ambientPath, total, audioPath);"),
            ("    let timings;\n    try {\n      timings = await wordTimings(job.script, job.tts_audio_url);\n    } catch (e) {\n      console.log(`Remote transcription alignment failed; using script-proportional fallback: ${e.message}`);\n      timings = estimateTimings(job.script, total);\n    }", "    const timings = await wordTimings(job.script, job.tts_audio_url);"),
          ]
          for old, new in replacements:
            if old not in s: raise SystemExit(f'Expected renderer text not found: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Wait for timing API deployment
        run: sleep 30
      - name: Render
        env:
          UNMINDY_CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Render attempt $attempt/3"
            if node scripts/render-reel.mjs; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1
      - name: Upload final render to Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -s .render-work/output.mp4
          node scripts/upload-dropbox.mjs .render-work/output.mp4 "/reel-${{ github.run_id }}-reference-style-final.mp4"
      - name: Download uploaded Dropbox render for audit
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X POST https://content.dropboxapi.com/2/files/download \
            -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" \
            -H "Dropbox-API-Arg: {\"path\":\"/reel-${{ github.run_id }}-reference-style-final.mp4\"}" \
            -o final.mp4
          test -s final.mp4
      - name: Audit actual final MP4
        run: |
          set -euo pipefail
          mkdir -p audit/frames
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=index,codec_name,codec_long_name,profile,width,height,pix_fmt,r_frame_rate,avg_frame_rate,bit_rate,channels,sample_rate,duration -of json final.mp4 > audit/ffprobe.json
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 final.mp4)
          python3 - "$DURATION" <<'PY'
          import sys, subprocess
          d=float(sys.argv[1])
          for i,p in enumerate([.00,.01,.03,.05,.10,.15,.20,.30,.40,.50,.60,.70,.80,.90,.97,.99,.999],1):
              t=max(0.0,min(d-0.02,d*p))
              subprocess.run(['ffmpeg','-y','-ss',f'{t:.3f}','-i','final.mp4','-frames:v','1','-q:v','2',f'audit/frames/frame-{i:02d}.jpg'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          PY
          ffmpeg -y -i final.mp4 -vn -af loudnorm=I=-14:TP=-1.5:LRA=11:print_format=json -f null - 2> audit/audio-loudness.txt || true
          cp final.mp4 audit/final.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 final.mp4)" = "1280"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 final.mp4)" = "720"
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-video-audit-${{ github.run_id }}
          path: audit
          retention-days: 3
