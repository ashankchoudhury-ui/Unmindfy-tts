name: UNMINDY Final Delivery Render

on:
  push:
    paths:
      - '.github/workflows/final-delivery-render.yml'
      - 'scripts/run-final-render.sh'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install render dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-urw-base35 python3-venv curl
          python3 -m venv /tmp/whisperx
          /tmp/whisperx/bin/python -m pip install --upgrade pip
          /tmp/whisperx/bin/python -m pip install whisperx
          /tmp/whisperx/bin/python -c "import whisperx; print('WhisperX ready')"
          command -v ffmpeg
          command -v ffprobe
          fc-match Courier
      - name: Fresh render
        env:
          UNMINDY_CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: bash scripts/run-final-render.sh
      - name: Verify output
        run: |
          set -euo pipefail
          test -s .render-work/output.mp4
          ffprobe -v error -show_entries format=duration,size -show_streams -of json .render-work/output.mp4
      - name: Preserve final MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-reel-${{ github.run_id }}
          path: .render-work/output.mp4
          if-no-files-found: error
          retention-days: 7
      - name: Upload final render to Dropbox
        continue-on-error: true
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          node scripts/upload-dropbox.mjs .render-work/output.mp4 "/reel-${{ github.run_id }}-reference-style-final.mp4"
      # trigger path enabled - fresh cycle
