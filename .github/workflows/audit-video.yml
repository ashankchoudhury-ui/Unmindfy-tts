name: UNMINDY Final Video Audit

on:
  push:
    paths:
      - '.github/workflows/audit-video.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download exact fresh Dropbox render
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X POST https://content.dropboxapi.com/2/files/download \
            -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" \
            -H 'Dropbox-API-Arg: {"path":"/reel-34701534075-reference-style-final.mp4"}' \
            -o final.mp4
          test -s final.mp4
      - name: Analyze actual MP4 and extract audit frames
        run: |
          set -euo pipefail
          mkdir -p audit/frames
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=index,codec_name,codec_long_name,profile,width,height,pix_fmt,r_frame_rate,avg_frame_rate,bit_rate,channels,sample_rate,duration -of json final.mp4 > audit/ffprobe.json
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 final.mp4)
          python3 - "$DURATION" <<'PY'
          import sys, subprocess
          d=float(sys.argv[1])
          for i,p in enumerate([.02,.10,.20,.30,.40,.50,.60,.70,.80,.90,.98],1):
              t=max(0.0,min(d-0.02,d*p))
              subprocess.run(['ffmpeg','-y','-ss',f'{t:.3f}','-i','final.mp4','-frames:v','1','-q:v','2',f'audit/frames/frame-{i:02d}.jpg'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          PY
          ffmpeg -y -i final.mp4 -vn -af loudnorm=I=-14:TP=-1.5:LRA=11:print_format=json -f null - 2> audit/audio-loudness.txt || true
          cp final.mp4 audit/final.mp4
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-video-audit-34701534075
          path: audit
          retention-days: 3
