name: UNMINDY Video Queue

on:
  workflow_run:
    workflows: ["UNMINDY TTS Queue"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/video-queue.yml'
      - 'scripts/upload-dropbox.mjs'
      - 'scripts/render-reel.mjs'

jobs:
  render-reel:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install render dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-urw-base35 python3 python3-venv curl
          python3 -m venv /tmp/whisperx
          /tmp/whisperx/bin/python -m pip install --upgrade pip
          /tmp/whisperx/bin/python -m pip install whisperx
          command -v ffmpeg
          command -v ffprobe
          /tmp/whisperx/bin/python -c "import whisperx; print('WhisperX ready')"
          fc-match Courier
      - name: Prepare renderer fallback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/render-reel.mjs')
          s = p.read_text()
          old = "    if (!music) throw new Error('No music file found in UNMINDY/Music');"
          new = "    if (!music) console.log('No music found; using generated ambient bed as fallback.');"
          if old not in s: raise SystemExit('Expected music guard not found')
          s = s.replace(old, new, 1)
          old = "    console.log(`Music: ${music.name}`);"
          new = "    console.log(`Music: ${music?.name || 'generated ambient bed'}`);"
          if old not in s: raise SystemExit('Expected music log line not found')
          s = s.replace(old, new, 1)
          old = "    await downloadDriveFile(token, music, musicPath);"
          new = "    if (music) await downloadDriveFile(token, music, musicPath);"
          if old not in s: raise SystemExit('Expected music download line not found')
          s = s.replace(old, new, 1)
          old = "    await buildAmbient(total, ambientPath);\n    await buildAudio(voicePath, musicPath, total, audioPath);"
          new = "    await buildAmbient(total, ambientPath);\n    await buildAudio(voicePath, music ? musicPath : ambientPath, total, audioPath);"
          if old not in s: raise SystemExit('Expected audio build lines not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Render and verify
        env:
          UNMINDY_CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: node scripts/render-reel.mjs
      - name: Upload verified render to Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/upload-dropbox.mjs .render-work/output.mp4 "/reel-${{ github.run_id }}-reference-style-final.mp4"
      # render-review-loop-v5
