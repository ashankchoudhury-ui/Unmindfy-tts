name: UNMINDY Video Queue
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  render-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install media tools and ASR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-urw-base35 python3-pocketsphinx
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          fc-match Courier
      - name: Render final Reel
        env:
          UNMINDY_CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/render-reel.mjs')
          s = p.read_text()
          old = 'const timings = await wordTimings(job.script, job.tts_audio_url);'
          new = "const timings = JSON.parse((await run('python3', ['scripts/local-word-timings.py', voice, job.script])).stdout);"
          if old not in s:
              raise SystemExit('Renderer timing hook not found; refusing to run.')
          p.write_text(s.replace(old, new, 1))
          PY
          node scripts/render-reel.mjs
