name: UNMINDY Video Queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render-reel.mjs"
      - "api/edit/**"
      - "api/drive/token.js"
      - ".github/workflows/video-queue.yml"

concurrency:
  group: unmindfy-video-queue
  cancel-in-progress: false

jobs:
  render-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Prepare renderer compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/render-reel.mjs')
          s=p.read_text()
          s=s.replace('jobAudioUrl','globalThis.jobAudio')
          old="const tracks=allM.filter(f=>(ar.test(f.name)||String(f.mimeType||'').startsWith('audio/'))&&!/(tts|voice|narration|speech|dialogue|mic)/i.test(f.name)).sort((a,b)=>Number(b.modifiedTime?Date.parse(b.modifiedTime):0)-Number(a.modifiedTime?Date.parse(a.modifiedTime):0));"
          new="const tracks=allM.filter(f=>(ar.test(f.name)||vr.test(f.name)||String(f.mimeType||'').startsWith('audio/')||String(f.mimeType||'').startsWith('video/'))&&!/(tts|voice|narration|speech|dialogue|mic)/i.test(f.name)).sort((a,b)=>Number(b.modifiedTime?Date.parse(b.modifiedTime):0)-Number(a.modifiedTime?Date.parse(a.modifiedTime):0));"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Render pending reel
        env:
          UNMINDY_CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: node scripts/render-reel.mjs
      - name: Upload render log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unmindfy-video-render-log
          path: .render-work
          retention-days: 2
          if-no-files-found: ignore
# v11 render compatibility trigger
