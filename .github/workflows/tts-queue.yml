# UNMINDY unified queue: TTS first, then render.
name: UNMINDY TTS Queue

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: unmindfy-tts-queue
  cancel-in-progress: false

jobs:
  process-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Process pending TTS jobs
        env:
          CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET}" || { echo "UNMINDY_CRON_SECRET is missing"; exit 1; }
          response=$(curl --fail-with-body -sS --retry 2 --connect-timeout 10 --max-time 120 -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://unmindfy-tts.vercel.app/api/cron")
          echo "$response"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg and Courier-compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-urw-base35
          fc-match Courier

      - name: Render pending reel
        env:
          UNMINDY_CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: node scripts/render-reel.mjs
