# UNMINDY TTS queue
name: UNMINDY TTS Queue

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:
  push:

concurrency:
  group: unmindfy-tts-queue
  cancel-in-progress: false

jobs:
  process-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Process pending TTS jobs
        env:
          CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET}" || { echo "UNMINDY_CRON_SECRET is missing"; exit 1; }
          # Give the Vercel production deployment triggered by the same push time to become ready.
          sleep 60

          # Dedicated Reel #13 generation using its exact delivery prompt.
          response=$(curl --fail-with-body -sS --retry 2 --connect-timeout 10 --max-time 240 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"recordId":"7d740517-7f7a-49c6-9106-7aabf996a09d"}' \
            "https://unmindfy-tts.vercel.app/api/tts13")
          echo "$response"
          # Reel #13 dedicated regeneration trigger.
