# UNMINDY TTS queue
name: UNMINDY TTS Queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:

concurrency:
  group: unmindfy-tts-queue
  cancel-in-progress: false

jobs:
  process-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Process pending TTS jobs
        env:
          CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET}" || { echo "UNMINDY_CRON_SECRET is missing"; exit 1; }
          # Trigger queue for pending UNMINDY TTS jobs.
          # Give the Vercel production deployment triggered by the same push time to become ready.
          sleep 60
          response=$(curl --fail-with-body -sS --retry 2 --connect-timeout 10 --max-time 240 -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://unmindfy-tts.vercel.app/api/cron")
          echo "$response"
          # Clear stalled TTS state only through the normal queue on the next scheduled run.
          # Reel #12 regeneration trigger
          # Regenerate after script pacing adjustment.
