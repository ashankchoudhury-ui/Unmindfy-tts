name: UNMINDY TTS Queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process-tts:
    runs-on: ubuntu-latest
    steps:
      - name: Process pending TTS jobs
        env:
          CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://unmindfy-tts.vercel.app/api/cron")
          echo "$response"
