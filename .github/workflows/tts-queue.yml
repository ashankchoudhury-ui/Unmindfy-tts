# UNMINDY TTS queue
name: UNMINDY TTS Queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:

concurrency:
  group: unmindfy-tts-queue
  cancel-in-progress: false

jobs:
  process-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Process pending TTS jobs
        env:
          CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET}" || { echo "UNMINDY_CRON_SECRET is missing"; exit 1; }
          sleep 60
          response=$(curl --fail-with-body -sS --retry 2 --connect-timeout 10 --max-time 240 -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://unmindfy-tts.vercel.app/api/cron")
          echo "$response"

      - name: Regenerate Reel 14 with exact tight pacing
        env:
          CRON_SECRET: ${{ secrets.UNMINDY_CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS --retry 2 --connect-timeout 10 --max-time 240 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"recordId":"cd1e9204-4b8f-4412-afcb-11e1d3e3a3e9"}' \
            "https://unmindfy-tts.vercel.app/api/tts14")
          echo "$response"
